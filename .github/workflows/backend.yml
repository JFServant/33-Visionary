name: Backend CI 🚀

on:
  push:
    paths:
      - "backend/**"
  pull_request:
    paths:
      - "backend/**"

jobs:
  # ---------------------
  # 1️⃣ Preflight Checks
  # ---------------------
  Preflight:
    name: 🔎 Preflight Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🥖 Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: 📦 Cache Dependencies
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: 📦 Install Dependencies
        run: bun install

      - name: ✅ Run Preflight (TS, Lint, etc.)
        run: bun run preflight

  # ---------------------
  # 2️⃣ Integration Tests
  # ---------------------
  Tests:
    name: 🧪 Integration Tests
    runs-on: ubuntu-latest
    needs: Preflight
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        ports:
          - "49323:5432"
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        options: >-
          --health-cmd="pg_isready -U test_user -d test_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      minio:
        image: minio/minio:latest
        ports:
          - "49327:9000"
        options: >-
          --entrypoint sh
          minio/minio:latest
          -c "minio server /data"
          --health-cmd="curl -f http://localhost:9000/minio/health/ready || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:8
        ports:
          - "49325:6379"
        options: >-
          --entrypoint sh
          redis:8
          -c "redis-server --requirepass redis_pass"
          --health-cmd="redis-cli -a redis_pass ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🥖 Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: 📦 Restore Cache
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: 📦 Install Dependencies
        run: bun install

      - name: ⚙️ Setup Environment
        run: bun run env:ci

      - name: 🗄️ Apply Test DB Schema
        run: bun run db:push:test

      - name: 🐳 Build and start model container
        run: |
          docker build -t model ../model
          docker run -d -p 49543:49543 --name model model
          until curl -sf http://localhost:49543/health; do sleep 1; done

      - name: 🧪 Run Integration Tests
        run: bun run test

      - name: 🐳 Stop and clean model container
        if: always()
        run: |
          docker stop model
          docker system prune -af

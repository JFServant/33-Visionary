name: Backend CI 🚀

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs:
  # ---------------------
  # 1️⃣ Preflight Checks
  # ---------------------
  Preflight:
    name: 🔎 Preflight Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🥖 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Cache Dependencies
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('backend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: 📦 Install Dependencies
        run: bun install

      - name: ✅ Run Preflight (TS, Lint, etc.)
        run: bun run preflight

  # ---------------------
  # 2️⃣ Integration Tests
  # ---------------------
  Tests:
    name: 🧪 Integration Tests
    runs-on: ubuntu-latest
    needs: Preflight
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐳 Start service containers
        run: |
          docker run -d --name postgres -p 49323:5432 \
            -e POSTGRES_DB=test_db -e POSTGRES_USER=test_user -e POSTGRES_PASSWORD=test_pass \
            postgres:17
          docker run -d --name redis -p 49325:6379 \
            redis:8 redis-server --requirepass redis_pass
          docker run -d --name minio -p 49327:9000 \
            minio/minio:latest server /data

      - name: 🥖 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Restore Cache
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('backend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: 📦 Install Dependencies
        run: bun install

      - name: ⚙️ Setup Environment
        run: bun run env:ci

      - name: ⏳ Wait for services
        run: |
          timeout 120 bash -c '
            until docker exec postgres pg_isready -U test_user -d test_db; do sleep 2; done
            until docker exec redis redis-cli -a redis_pass ping | grep -q PONG; do sleep 2; done
            until curl -sf http://localhost:49327/minio/health/ready > /dev/null; do sleep 2; done'

      - name: 🗄️ Apply Test DB Schema
        run: bun run db:push:test

      - name: 🐳 Build and start model container
        run: |
          docker build -t model ../model
          docker run -d -p 49543:49543 --name model model
          until curl -sf http://localhost:49543/health; do sleep 1; done

      - name: 🧪 Run Integration Tests
        run: bun run test

      - name: 🐳 Stop and clean containers
        if: always()
        run: docker rm -f postgres redis minio model

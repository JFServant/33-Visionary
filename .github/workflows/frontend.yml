name: Frontend CI 🚀

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

jobs:
  # ---------------------
  # 1️⃣ Preflight Checks
  # ---------------------
  Preflight:
    name: 🔎 Preflight Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🥖 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20

      - name: 📦 Cache Dependencies
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: 📦 Install Dependencies
        run: bun install

      - name: ✅ Run Preflight (TS, Lint, etc.)
        run: bun run preflight

  # ---------------------
  # 2️⃣ Integration Tests
  # ---------------------
  Tests:
    name: 🧪 Integration Tests
    runs-on: ubuntu-latest
    needs: Preflight
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🥖 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20

      - name: 📦 Cache Dependencies
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: 📦 Install Dependencies
        run: bun install

      - name: 🧪 Run Integration Tests
        run: bun run test

  # ---------------------
  # 3️⃣ End-to-End Tests
  # ---------------------
  E2E:
    name: 🧪 End-to-End Tests
    runs-on: ubuntu-latest
    needs: Preflight
    timeout-minutes: 25
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🥖 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20

      - name: 📦 Cache Dependencies
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: 🌳 Cache Cypress Binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: ${{ runner.os }}-cypress-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-cypress-

      - name: 📦 Install Dependencies
        working-directory: frontend
        run: |
          bun install
          bunx cypress install

      - name: ⚙️ Setup Environment
        run: cp .env.example .env

      - name: 🐳 Start the stack
        run: docker compose up -d --wait --build

      - name: ⏳ Wait for services
        run: |
          timeout 180 bash -c '
            for url in http://localhost:49432 http://localhost:49321/health http://localhost:49543/health; do
              until curl -sf "$url" > /dev/null; do echo "waiting for $url"; sleep 2; done
            done'

      - name: 🧪 Run E2E Tests
        working-directory: frontend
        run: bun run e2e

      - name: 🪵 Dump compose logs
        if: failure()
        run: docker compose logs

      - name: 🧹 Tear down
        if: always()
        run: docker compose down -v

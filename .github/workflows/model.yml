name: Model CI 🚀

on:
  push:
    branches: [main]
    paths:
      - "model/**"
      - ".github/workflows/model.yml"
  pull_request:
    paths:
      - "model/**"
      - ".github/workflows/model.yml"

jobs:
  # ---------------------
  # 1️⃣ Preflight Checks
  # ---------------------
  Preflight:
    name: 🔎 Preflight Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: model
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: model/package-lock.json

      - name: 📦 Install Dependencies
        run: npm ci

      - name: ✅ Run Preflight (TS, Lint, etc.)
        run: npm run preflight

  # ---------------------
  # 2️⃣ Integration Tests
  # ---------------------
  Tests:
    name: 🧪 Integration Tests
    runs-on: ubuntu-latest
    needs: Preflight
    timeout-minutes: 15
    defaults:
      run:
        working-directory: model
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: model/package-lock.json

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🧪 Run Integration Tests
        run: npm run test

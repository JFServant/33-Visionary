name: Model CI/CD 🚀

on:
  push:
    paths:
      - "model/**"
  pull_request:
    paths:
      - "model/**"

jobs:
  # ---------------------
  # 1️⃣ Preflight Checks
  # ---------------------
  Preflight:
    name: 🔎 Preflight Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: model
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: model/package-lock.json

      - name: 📦 Install Dependencies
        run: npm ci

      - name: ✅ Run Preflight (TS, Lint, etc.)
        run: npm run preflight

  # ---------------------
  # 2️⃣ Integration Tests
  # ---------------------
  Tests:
    name: 🧪 Integration Tests
    runs-on: ubuntu-latest
    needs: Preflight
    defaults:
      run:
        working-directory: model
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: model/package-lock.json

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🧪 Run Integration Tests
        run: npm run test

  # ---------------------
  # 3️⃣ Deploy (Dummy)
  # ---------------------
  Deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: Tests
    if: github.ref_name == 'main'
    steps:
      - name: 📦 Dummy Deploy
        run: echo "🚀 Deploying to production... (dummy step)"

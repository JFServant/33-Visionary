services:
  local_db:
    image: postgres:17
    container_name: ${LOCAL_DB_HOST}
    restart: always
    env_file:
      - .env
    ports:
      - '${LOCAL_DB_PORT}:5432'
    environment:
      POSTGRES_DB: ${LOCAL_DB_NAME}
      POSTGRES_USER: ${LOCAL_DB_USER}
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD}
    volumes:
      - local_db_data:/var/lib/postgresql/data

  test_db:
    image: postgres:17
    container_name: ${TEST_DB_HOST}
    restart: always
    env_file:
      - .env
    ports:
      - '${TEST_DB_PORT}:5432'
    environment:
      POSTGRES_DB: ${TEST_DB_NAME}
      POSTGRES_USER: ${TEST_DB_USER}
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD}
    volumes:
      - test_db_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: pgadmin
    restart: always
    env_file:
      - .env
    ports:
      - '${_PGADMIN_PORT}:80'
    environment:
      PGADMIN_DEFAULT_EMAIL: ${_PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${_PGADMIN_PASSWORD}
    volumes:
      - ./servers.json:/pgadmin4/servers.json
    depends_on:
      - local_db
      - test_db

volumes:
  local_db_data:
  test_db_data:
